<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Survival City — پروتوتایپ</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#1a1a1a;font-family:Tahoma,Arial,sans-serif;}
  canvas{display:block;touch-action:none;}

  #ui{position:fixed;top:14px;left:14px;color:#fff;z-index:10;user-select:none;}
  .bar-label{font-size:12px;text-shadow:0 1px 3px #000;margin-bottom:2px;letter-spacing:.5px}
  .bar{width:140px;height:10px;background:rgba(0,0,0,0.45);border-radius:5px;margin:2px 0 10px 0;overflow:hidden;border:1px solid rgba(255,255,255,0.25)}
  .bar-fill{height:100%;transition:width .2s}

  #crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,0.85);z-index:9;pointer-events:none;box-shadow:0 0 3px #000}

  #lookArea{position:fixed;top:0;right:0;width:62%;height:100%;z-index:5;}

  #joystick{position:fixed;bottom:36px;left:36px;width:120px;height:120px;border-radius:50%;
    background:rgba(255,255,255,0.10);border:2px solid rgba(255,255,255,0.35);z-index:10;}
  #joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.55);
    top:34px;left:34px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,0.4)}

  #jumpBtn{position:fixed;bottom:46px;right:34px;width:78px;height:78px;border-radius:50%;
    background:rgba(255,140,0,0.35);border:2px solid rgba(255,180,80,0.6);color:#fff;
    font-size:13px;z-index:10;display:flex;align-items:center;justify-content:center;user-select:none;}

  #hint{position:fixed;bottom:150px;width:100%;text-align:center;color:#fff;font-size:12px;
    text-shadow:0 1px 3px #000;opacity:.85;z-index:10;pointer-events:none;}

  #loading{position:fixed;inset:0;background:#0a0a0a;color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:16px;z-index:100;}
</style>
</head>
<body>

<div id="loading">در حال ساخت دنیا...</div>

<div id="ui">
  <div class="bar-label">❤ سلامتی</div>
  <div class="bar"><div class="bar-fill" id="healthBar" style="width:100%;background:#e33a3a;"></div></div>
  <div class="bar-label">🍖 گرسنگی</div>
  <div class="bar"><div class="bar-fill" id="hungerBar" style="width:100%;background:#e9a83a;"></div></div>
</div>

<div id="crosshair"></div>
<div id="hint">👆 سمت راست صفحه رو بکش برای نگاه کردن، جوی‌استیک برای حرکت</div>

<div id="lookArea"></div>
<div id="joystick"><div id="joyKnob"></div></div>
<div id="jumpBtn">پرش</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Basic scene setup ----------
const scene = new THREE.Scene();
const skyColor = 0xf5c98a; // warm sunset-ish sky, GTA SA vibe
scene.background = new THREE.Color(skyColor);
scene.fog = new THREE.Fog(skyColor, 15, 90);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Lighting (warm "GTA SA sunny" look) ----------
const hemi = new THREE.HemisphereLight(0xffe9c4, 0x8a6a4a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(40, 60, -20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
scene.add(sun);

// ---------- Voxel-ish terrain ----------
const GRID = 32;           // grid is GRID x GRID cells
const CELL = 1;            // size of each block
const heights = [];
function heightAt(gx, gz){
  gx = Math.max(0, Math.min(GRID-1, gx));
  gz = Math.max(0, Math.min(GRID-1, gz));
  return heights[gx][gz];
}
const center = GRID/2;
for(let x=0;x<GRID;x++){
  heights.push([]);
  for(let z=0;z<GRID;z++){
    const d = Math.hypot(x-center, z-center);
    let h;
    if(d < 7){ h = 1; } // flat town square
    else{
      h = Math.max(0, Math.round(2 + 2*Math.sin(x*0.35) + 2*Math.cos(z*0.3) - d*0.05));
    }
    heights[x].push(h);
  }
}

const boxGeo = new THREE.BoxGeometry(CELL, 1, CELL);
function colorForHeight(h){
  if(h<=1) return 0xd8c08a;      // sand / dirt road (town square)
  if(h<=2) return 0x6fae4e;      // grass
  if(h<=4) return 0x4c8b3d;      // hill grass
  return 0x8a8a86;               // rock
}

const blockGroup = new THREE.Group();
for(let x=0;x<GRID;x++){
  for(let z=0;z<GRID;z++){
    const h = heights[x][z];
    const stacks = Math.max(1,h);
    for(let y=0;y<stacks;y++){
      const mat = new THREE.MeshLambertMaterial({ color: colorForHeight(y+1) });
      const cube = new THREE.Mesh(boxGeo, mat);
      cube.position.set(x-center, y+0.5, z-center);
      cube.receiveShadow = true;
      cube.castShadow = true;
      blockGroup.add(cube);
    }
  }
}
scene.add(blockGroup);

// ---------- A few GTA-SA-ish buildings in the town square ----------
function makeBuilding(x,z,w,h,d,color, roofColor){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color}));
  body.position.y = h/2 + 1;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w*1.05,0.4,d*1.05), new THREE.MeshLambertMaterial({color:roofColor}));
  roof.position.y = h + 1.2;
  g.add(roof);
  g.position.set(x,0,z);
  scene.add(g);
}
makeBuilding(-6,-6, 5,7,5, 0xdcb98a, 0x8a3d2b);
makeBuilding( 6,-6, 4,10,4, 0xc9a876, 0x5b3a2b);
makeBuilding(-6, 6, 6,5,4, 0xe0c9a0, 0x7a4a2b);
makeBuilding( 6, 6, 4,13,4, 0xb99b6e, 0x4a2f22);

// ---------- Simple parked cars (GTA nod) ----------
function makeCar(x,z,color, rotY){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2,0.6,1), new THREE.MeshLambertMaterial({color}));
  body.position.y = 1.3;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1,0.5,0.9), new THREE.MeshLambertMaterial({color:0x223344}));
  cabin.position.set(0,1.7,0);
  g.add(body,cabin);
  g.rotation.y = rotY;
  g.position.set(x,0,z);
  scene.add(g);
}
makeCar(-2,-2,0xb32020,0.3);
makeCar(2,-1,0x2050b3,-0.5);

// ---------- Palm trees scattered outside the square ----------
function makePalm(x,z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,3,6), new THREE.MeshLambertMaterial({color:0x7a5230}));
  trunk.position.y = heightAt(Math.round(x+center),Math.round(z+center)) + 1.5;
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.1,6,6), new THREE.MeshLambertMaterial({color:0x2e7d32}));
  leaves.position.y = trunk.position.y + 1.6;
  leaves.scale.set(1,0.6,1);
  g.add(trunk,leaves);
  g.position.set(x,0,z);
  scene.add(g);
}
for(let i=0;i<14;i++){
  const gx = Math.floor(Math.random()*GRID), gz = Math.floor(Math.random()*GRID);
  const d = Math.hypot(gx-center, gz-center);
  if(d>9 && d<15){
    makePalm(gx-center, gz-center);
  }
}

// ---------- Player state ----------
const player = {
  x: 0, z: 0,
  feetY: heightAt(Math.round(center),Math.round(center)),
  velY: 0,
  yaw: 0,
  pitch: 0,
  onGround: true
};
const EYE_HEIGHT = 1.6;
const GRAVITY = 18;
const JUMP_SPEED = 6.5;
const MOVE_SPEED = 4.2;

// ---------- Touch / mouse look (drag on right side of screen) ----------
const lookArea = document.getElementById('lookArea');
let looking = false, lastX=0, lastY=0;
lookArea.addEventListener('pointerdown', e=>{ looking=true; lastX=e.clientX; lastY=e.clientY; lookArea.setPointerCapture(e.pointerId); });
lookArea.addEventListener('pointerup', e=>{ looking=false; });
lookArea.addEventListener('pointermove', e=>{
  if(!looking) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  player.yaw   -= dx*0.0035;
  player.pitch -= dy*0.0035;
  player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
});

// ---------- Joystick ----------
const joystick = document.getElementById('joystick');
const joyKnob = document.getElementById('joyKnob');
let joyActive=false, joyCenter={x:0,y:0}, joyVec={x:0,y:0};
function joyRect(){ return joystick.getBoundingClientRect(); }
joystick.addEventListener('pointerdown', e=>{
  joyActive=true;
  const r = joyRect();
  joyCenter = { x:r.left+r.width/2, y:r.top+r.height/2 };
  joystick.setPointerCapture(e.pointerId);
});
joystick.addEventListener('pointerup', ()=>{
  joyActive=false; joyVec={x:0,y:0};
  joyKnob.style.top='34px'; joyKnob.style.left='34px';
});
joystick.addEventListener('pointermove', e=>{
  if(!joyActive) return;
  let dx = e.clientX-joyCenter.x, dy = e.clientY-joyCenter.y;
  const max = 40;
  const len = Math.hypot(dx,dy);
  if(len>max){ dx = dx/len*max; dy = dy/len*max; }
  joyKnob.style.left = (34+dx)+'px';
  joyKnob.style.top  = (34+dy)+'px';
  joyVec = { x: dx/max, y: dy/max };
});

// ---------- Jump button ----------
document.getElementById('jumpBtn').addEventListener('pointerdown', ()=>{
  if(player.onGround){ player.velY = JUMP_SPEED; player.onGround=false; }
});

// ---------- Main loop ----------
const clock = new THREE.Clock();
document.getElementById('loading').style.display='none';

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  // horizontal movement relative to camera yaw
  const forward = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);
  const right   = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);
  const moveX = joyVec.x, moveZ = -joyVec.y; // up on joystick = forward
  const mvx = (forward.x*moveZ + right.x*moveX) * MOVE_SPEED * dt;
  const mvz = (forward.z*moveZ + right.z*moveX) * MOVE_SPEED * dt;
  player.x += mvx;
  player.z += mvz;
  const half = center - 0.5;
  player.x = Math.max(-half, Math.min(half, player.x));
  player.z = Math.max(-half, Math.min(half, player.z));

  // vertical / gravity
  const groundY = heightAt(Math.round(player.x+center), Math.round(player.z+center));
  player.velY -= GRAVITY*dt;
  const nextFeetY = player.feetY + player.velY*dt;
  if(nextFeetY <= groundY){
    player.feetY = groundY;
    player.velY = 0;
    player.onGround = true;
  } else {
    player.feetY = nextFeetY;
    player.onGround = false;
  }

  camera.position.set(player.x, player.feetY+EYE_HEIGHT, player.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
