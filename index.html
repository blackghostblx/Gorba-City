<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Craft City - Minecraft Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}

  /* D-PAD MINECRAFT CONTROLS */
  #dpad{position:fixed;bottom:20px;left:20px;width:120px;height:120px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px}
  .dbtn{background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:18px;touch-action:none}
  .dbtn:active{background:rgba(255,255,255,0.5)}
  #btnUp{grid-column:2;grid-row:1}
  #btnLeft{grid-column:1;grid-row:2}
  #btnJump{grid-column:2;grid-row:2;background:rgba(255,255,255,0.35);border-radius:50%}
  #btnRight{grid-column:3;grid-row:2}
  #btnDown{grid-column:2;grid-row:3}

  /* TOUCH LOOK AREA */
  #lookArea{position:fixed;top:0;right:0;width:60%;height:100%;z-index:10;touch-action:none}

  /* MINECRAFT HUD & HOTBAR */
  #hudContainer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
  #hearts{display:flex;gap:2px;font-size:16px}
  #hotbar{display:flex;background:rgba(0,0,0,0.6);border:3px solid #3c3c3c;padding:2px;gap:2px;border-radius:4px;pointer-events:auto}
  .slot{width:40px;height:40px;background:rgba(255,255,255,0.1);border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;position:relative;cursor:pointer}
  .slot.active{border-color:#fff;background:rgba(255,255,255,0.3)}
  .slot .count{position:absolute;bottom:1px;right:3px;font-size:10px;font-weight:bold;color:#fff;text-shadow:1px 1px 1px #000}

  #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;color:rgba(255,255,255,0.8);font-size:20px;pointer-events:none}
</style>
</head>
<body>

<div id="crosshair">+</div>
<div id="lookArea"></div>

<!-- MINECRAFT D-PAD -->
<div id="dpad">
  <div class="dbtn" id="btnUp">▲</div>
  <div class="dbtn" id="btnLeft">◄</div>
  <div class="dbtn" id="btnJump">●</div>
  <div class="dbtn" id="btnRight">►</div>
  <div class="dbtn" id="btnDown">▼</div>
</div>

<!-- MINECRAFT HUD -->
<div id="hudContainer">
  <div id="hearts">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
  <div id="hotbar">
    <div class="slot active" data-idx="0">🪓<span class="count">1</span></div>
    <div class="slot" data-idx="1"></div>
    <div class="slot" data-idx="2"></div>
    <div class="slot" data-idx="3"></div>
    <div class="slot" data-idx="4"></div>
    <div class="slot" data-idx="5"></div>
    <div class="slot" data-idx="6"></div>
    <div class="slot" data-idx="7"></div>
    <div class="slot" data-idx="8"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// THREE.JS SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee);
scene.fog = new THREE.FogExp2(0x7ec0ee, 0.015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// RESIZE HANDLER
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// LIGHTS (SUN)
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfffaed, 1.0);
sun.position.set(60, 120, 40);
sun.castShadow = true;
scene.add(sun);

// SUN MESH
const sunGeo = new THREE.BoxGeometry(10, 10, 10);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffe0 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.position.set(100, 200, 80);
scene.add(sunMesh);

// CLOUDS (MINECRAFT STYLE)
const cloudGroup = new THREE.Group();
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
for(let i=0; i<25; i++){
  const cGeo = new THREE.BoxGeometry(15 + Math.random()*20, 3, 10 + Math.random()*15);
  const cloud = new THREE.Mesh(cGeo, cloudMat);
  cloud.position.set((Math.random()-0.5)*300, 50 + Math.random()*10, (Math.random()-0.5)*300);
  cloudGroup.add(cloud);
}
scene.add(cloudGroup);

// GROUND
const groundGeo = new THREE.PlaneGeometry(300, 300);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x559933, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// PLAYER BODY
const playerGroup = new THREE.Group();
scene.add(playerGroup);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x008080 });
const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), bodyMat);
body.position.y = 0.8;
playerGroup.add(body);

const legMat = new THREE.MeshStandardMaterial({ color: 0x000080 });
const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), legMat);
leftLeg.position.set(-0.15, 0.35, 0);
const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), legMat);
rightLeg.position.set(0.15, 0.35, 0);
playerGroup.add(leftLeg, rightLeg);

// HELD ITEM (AXE IN RIGHT HAND)
const handGroup = new THREE.Group();
const axeHandle = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.5, 0.05), new THREE.MeshStandardMaterial({color: 0x8b5a2b}));
const axeBlade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.05), new THREE.MeshStandardMaterial({color: 0xaaaaaa}));
axeBlade.position.set(0.08, 0.2, 0);
handGroup.add(axeHandle, axeBlade);
handGroup.position.set(0.3, 0.2, -0.4);
camera.add(handGroup);
scene.add(camera);

// TREES & LOGS SYSTEM
const trees = [];
const logsOnGround = [];
const treeTrunkGeo = new THREE.BoxGeometry(0.8, 4, 0.8);
const treeLeavesGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x674d3c });
const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });

function spawnTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(treeTrunkGeo, trunkMat);
  trunk.position.y = 2;
  trunk.castShadow = true;
  g.add(trunk);

  const leaves = new THREE.Mesh(treeLeavesGeo, leavesMat);
  leaves.position.y = 4.5;
  leaves.castShadow = true;
  g.add(leaves);

  g.position.set(x, 0, z);
  scene.add(g);

  trees.push({ group: g, hits: 0, x, z });
}

// Spawning initial trees
for(let i=0; i<45; i++){
  const rx = (Math.random()-0.5)*180;
  const rz = (Math.random()-0.5)*180;
  if(Math.hypot(rx, rz) > 6) spawnTree(rx, rz);
}

// LOG ITEM (WHEN TREE IS CUT)
const logGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
function dropLogs(x, z) {
  for(let i=0; i<3; i++){
    const log = new THREE.Mesh(logGeo, trunkMat);
    log.position.set(x + (Math.random()-0.5)*1.5, 0.2, z + (Math.random()-0.5)*1.5);
    scene.add(log);
    logsOnGround.push(log);
  }
}

// INVENTORY SYSTEM
let selectedSlot = 0;
const inventoryData = Array(9).fill(null);
inventoryData[0] = { emoji: '🪓', count: 1, type: 'axe' };

const slotsUI = document.querySelectorAll('#hotbar .slot');
slotsUI.forEach(slot => {
  slot.addEventListener('click', () => {
    slotsUI.forEach(s => s.classList.remove('active'));
    slot.classList.add('active');
    selectedSlot = parseInt(slot.dataset.idx);
    handGroup.visible = (inventoryData[selectedSlot]?.type === 'axe');
  });
});

function updateHotbarUI() {
  slotsUI.forEach((slot, i) => {
    const item = inventoryData[i];
    if(item) {
      slot.innerHTML = `${item.emoji}<span class="count">${item.count}</span>`;
    } else {
      slot.innerHTML = '';
    }
  });
}

// CONTROLS & MOVEMENT
const player = { x: 0, z: 0, y: 0, velY: 0, yaw: 0, pitch: 0, onGround: true };
const moveState = { fwd: false, bwd: false, lft: false, rgt: false };

const bindBtn = (id, key) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); moveState[key] = true; });
  el.addEventListener('pointerup', (e) => { e.preventDefault(); moveState[key] = false; });
  el.addEventListener('pointerleave', () => { moveState[key] = false; });
};
bindBtn('btnUp', 'fwd');
bindBtn('btnDown', 'bwd');
bindBtn('btnLeft', 'lft');
bindBtn('btnRight', 'rgt');

document.getElementById('btnJump').addEventListener('pointerdown', () => {
  if (player.onGround) { player.velY = 6.5; player.onGround = false; }
});

// TOUCH LOOK
const lookArea = document.getElementById('lookArea');
let looking = false, lx = 0, ly = 0;
lookArea.addEventListener('pointerdown', e => { looking = true; lx = e.clientX; ly = e.clientY; });
lookArea.addEventListener('pointerup', () => looking = false);
lookArea.addEventListener('pointermove', e => {
  if (!looking) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  player.yaw -= dx * 0.005;
  player.pitch -= dy * 0.005;
  player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
});

// HIT TREES & PICKUP LOGS (CLICK/TOUCH IN WORLD)
const raycaster = new THREE.Raycaster();
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#dpad') || e.target.closest('#hudContainer')) return;

  // Raycast from camera center
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  
  // 1. Check Tree Hit
  const held = inventoryData[selectedSlot];
  if (held && held.type === 'axe') {
    for (let i = trees.length - 1; i >= 0; i--) {
      const t = trees[i];
      if (camera.position.distanceTo(t.group.position) < 5) {
        const intersects = raycaster.intersectObjects(t.group.children);
        if (intersects.length > 0) {
          t.hits++;
          // Swing Axe
          handGroup.rotation.x = -0.8;
          setTimeout(() => handGroup.rotation.x = 0, 150);

          if (t.hits >= 3) {
            scene.remove(t.group);
            dropLogs(t.x, t.z);
            trees.splice(i, 1);
          }
          return;
        }
      }
    }
  }

  // 2. Pickup Wood Logs
  for (let i = logsOnGround.length - 1; i >= 0; i--) {
    const log = logsOnGround[i];
    if (camera.position.distanceTo(log.position) < 3.5) {
      const intersects = raycaster.intersectObject(log);
      if (intersects.length > 0) {
        scene.remove(log);
        logsOnGround.splice(i, 1);
        
        // Add to inventory
        let woodSlot = inventoryData.find(s => s && s.type === 'wood');
        if (woodSlot) {
          woodSlot.count++;
        } else {
          const emptyIdx = inventoryData.findIndex(s => s === null);
          if (emptyIdx !== -1) inventoryData[emptyIdx] = { emoji: '🪵', count: 1, type: 'wood' };
        }
        updateHotbarUI();
        return;
      }
    }
  }
});

// GAME LOOP
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  // Movement Calculation
  const speed = 6;
  let moveZ = (moveState.fwd ? 1 : 0) - (moveState.bwd ? 1 : 0);
  let moveX = (moveState.rgt ? 1 : 0) - (moveState.lft ? 1 : 0);

  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
  const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);

  player.x += (forward.x * moveZ + right.x * moveX) * speed * dt;
  player.z += (forward.z * moveZ + right.z * moveX) * speed * dt;

  // Gravity
  player.velY -= 18 * dt;
  player.y += player.velY * dt;
  if (player.y <= 0) { player.y = 0; player.velY = 0; player.onGround = true; }

  // Update Body & Camera
  playerGroup.position.set(player.x, player.y, player.z);
  playerGroup.rotation.y = player.yaw;

  camera.position.set(player.x, player.y + 1.5, player.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // Cloud Animation
  cloudGroup.children.forEach(c => {
    c.position.x += dt * 2;
    if(c.position.x > 150) c.position.x = -150;
  });

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
