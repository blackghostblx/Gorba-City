<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gorba City</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#241b3a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#100b1c;font-family:Tahoma,Arial,sans-serif;height:100%;}
  canvas{display:block;touch-action:none;}

  #loading{position:fixed;inset:0;background:#161616;color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:100;transition:opacity .5s ease;}
  #loading.hide{opacity:0;pointer-events:none;}
  #loadingLogo{width:120px;height:120px;}
  #loadingTitle{margin-top:14px;font-size:24px;font-weight:bold;letter-spacing:2px;
    color:#f5c98a;font-family:'Comic Sans MS','Segoe Print',Tahoma,cursive,sans-serif;}
  #loadingSub{margin-top:10px;font-size:12px;color:#aaa;letter-spacing:1px;}

  #rotateOverlay{position:fixed;inset:0;background:#000;color:#fff;display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:200;text-align:center;font-size:14px;padding:20px;}
  @media (orientation: portrait){ #rotateOverlay{display:flex;} }
  #rotateIcon{font-size:40px;margin-bottom:12px;animation:rot 1.6s ease-in-out infinite;}
  @keyframes rot{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}

  #genderSelect{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(16,11,28,0.55);backdrop-filter:blur(2px);}
  #genderSelect h2{color:#fff;font-size:18px;margin-bottom:22px;text-shadow:0 2px 6px #000;}
  #genderCards{display:flex;gap:22px;}
  .card{width:120px;height:150px;border-radius:16px;background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.25);display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;font-size:15px;gap:10px;transition:transform .15s, background .15s;}
  .card:active{transform:scale(0.94);background:rgba(255,255,255,0.2);}
  .card .emoji{font-size:44px;}

  #skipBtn{position:fixed;top:16px;left:16px;z-index:40;background:rgba(0,0,0,0.4);color:#fff;
    border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:8px 16px;font-size:12px;display:none;}
  #speedTag{position:fixed;top:16px;right:16px;color:#fff;font-size:13px;opacity:.85;
    text-shadow:0 1px 3px #000;z-index:20;display:none;background:rgba(0,0,0,0.35);
    padding:6px 12px;border-radius:14px;}

  .ctrlBtn{position:fixed;z-index:30;width:72px;height:72px;border-radius:50%;display:none;
    align-items:center;justify-content:center;color:#fff;font-size:26px;user-select:none;
    border:2px solid rgba(255,255,255,0.35);}
  #leftBtn{bottom:34px;left:20px;background:rgba(255,255,255,0.12);}
  #rightBtn{bottom:34px;left:104px;background:rgba(255,255,255,0.12);}
  #brakeBtn{bottom:34px;right:20px;background:rgba(255,70,70,0.28);}
  #gasBtn{bottom:34px;right:104px;background:rgba(120,255,140,0.28);}
  .ctrlBtn.active{filter:brightness(1.6);}
</style>
</head>
<body>

    <circle cx="77" cy="100" r="4" fill="#f5c98a"/>

  <div id="loadingTitle">Gorba City</div>
  <div id="loadingSub">در حال آماده‌سازی جاده...</div>
</div>

<div id="rotateOverlay">
  <div id="rotateIcon">📱</div>
  <div>گوشیتو بچرخون، این بازی افقیه</div>
</div>

<div id="genderSelect">
  <h2>شخصیتت رو انتخاب کن</h2>
  <div id="genderCards">
    <div class="card" id="pickFemale"><div class="emoji">👩</div>زن</div>
    <div class="card" id="pickMale"><div class="emoji">👨</div>مرد</div>
  </div>
</div>

// ================= road (curved, glowing, endless) =================
const ROAD_WIDTH = 10;
const SEG_LEN = 25;
const SEG_STEPS = 6;
const N_SEG = 18;

function curveX(z){
  const d = -z;
  const amp = Math.min(34, 3 + d*0.02);
  const freq = Math.min(0.085, 0.02 + d*0.00005);
  return amp*Math.sin(d*freq);
}

function buildRoadRibbon(zStart, zEnd, steps){
  const half = ROAD_WIDTH/2;
  const positions = [], colors = [];
  const leftC = new THREE.Color(0xff5fd8), midC = new THREE.Color(0x241b3a), rightC = new THREE.Color(0x5fe0ff);
  for(let i=0;i<=steps;i++){
    const z = zStart + (zEnd-zStart)*(i/steps);
    const cx = curveX(z);
    positions.push(cx-half,0,z,  cx,0,z,  cx+half,0,z);
    colors.push(leftC.r,leftC.g,leftC.b, midC.r,midC.g,midC.b, rightC.r,rightC.g,rightC.b);
  }
  const indices = [];
  for(let i=0;i<steps;i++){
    const r0=i*3, r1=(i+1)*3;
    indices.push(r0,r1,r0+1,  r1,r1+1,r0+1);
    indices.push(r0+1,r1+1,r0+2,  r1+1,r1+2,r0+2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
  geo.setIndex(indices);
  return geo;
}

const roadMat = new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide, fog:true});
const segments = [];
let frontZ = 0;
for(let i=0;i<N_SEG;i++){
  const zStart = frontZ, zEnd = frontZ - SEG_LEN;
  const mesh = new THREE.Mesh(buildRoadRibbon(zStart,zEnd,SEG_STEPS), roadMat);
  mesh.position.y = 0.01;
  scene.add(mesh);
  segments.push({mesh, zStart, zEnd});
  frontZ = zEnd;
}

// ================= decorative fantasy scenery + real trees =================
const barkTex = texLoader.load(TEX_BARK);
barkTex.wrapS = barkTex.wrapT = THREE.RepeatWrapping;
barkTex.repeat.set(1,1);
const leafTex = texLoader.load(TEX_LEAF);
leafTex.needsUpdate = true;

function makeTree(){
  const g = new THREE.Group();
  const th = 2.2+Math.random()*1.6;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.22,th,7), new THREE.MeshBasicMaterial({map:barkTex}));
  trunk.position.y = th/2;
  g.add(trunk);
  const leafMat = new THREE.MeshBasicMaterial({map:leafTex, transparent:true, alphaTest:0.25, side:THREE.DoubleSide, fog:true});
  const s = 2.4+Math.random()*1.6;
  const p1 = new THREE.Mesh(new THREE.PlaneGeometry(s,s), leafMat);
  p1.position.y = th + s*0.32;
  const p2 = p1.clone();
  p2.rotation.y = Math.PI/2;
  g.add(p1,p2);
  return g;
}
function makeCluster(){
  const g = new THREE.Group();
  const type = Math.random();
  if(type<0.18){
    const h = 6+Math.random()*14;
    const colors=[0x6a3fb8,0x3f6ab8,0xb83f8a];
    const m = new THREE.Mesh(new THREE.ConeGeometry(3+Math.random()*3,h,5), new THREE.MeshBasicMaterial({color:colors[Math.floor(Math.random()*3)]}));
    m.position.y = h/2;
    g.add(m);
  } else if(type<0.36){
    const s = 2+Math.random()*2;
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s,0), new THREE.MeshBasicMaterial({color:0x8a6ad0}));
    m.position.y = 10+Math.random()*14;
    g.userData.island = m;
    g.userData.baseY = m.position.y;
    g.userData.bob = Math.random()*Math.PI*2;
    g.add(m);
  } else {
    g.add(makeTree());
  }
  return g;
}
const clusters = [];
const N_CLUSTERS = 46;
for(let i=0;i<N_CLUSTERS;i++){
  const g = makeCluster();
  const z = -6 - i*11 - Math.random()*8;
  const side = i%2===0?-1:1;
  const dist = 7+Math.random()*20;
  g.position.set(curveX(z)+side*dist, g.position.y||0, z);
  scene.add(g);
  clusters.push(g);
}

  function arm(sign){
    const grp = new THREE.Group();
    const upper = makeLimbSegment(0.055,0.05,0.32,s.outfit);
    upper.position.y = -0.16;
    grp.add(upper);
    const fore = makeLimbSegment(0.048,0.042,0.3,s.skin);
    fore.position.y = -0.16-0.31;
    grp.add(fore);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), new THREE.MeshBasicMaterial({color:s.skin}));
    hand.position.y = -0.16-0.31-0.18;
    grp.add(hand);
    grp.position.set(sign*0.24,1.5,0);
    grp.rotation.z = sign*0.08;
    return grp;
  }
  g.add(arm(-1), arm(1));

  function leg(sign){
    const grp = new THREE.Group();
    const thigh = makeLimbSegment(0.075,0.065,0.42,s.pants);
    thigh.position.y = -0.21;
    grp.add(thigh);
    const shin = makeLimbSegment(0.06,0.05,0.4,s.pants);
    shin.position.y = -0.21-0.41;
    grp.add(shin);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.11,0.08,0.22), new THREE.MeshBasicMaterial({color:s.shoe}));
    shoe.position.set(0,-0.21-0.41-0.22,0.04);
    grp.add(shoe);
    grp.position.set(sign*0.1,0.92,0);
    return grp;
  }
  g.add(leg(-1), leg(1));

  return g;
}

// ================= muscle car (Challenger-style) with visible interior =================
function makeCarExterior(){
  const g = new THREE.Group();
  const paint = 0xff6a1a;
  const paintMat = new THREE.MeshBasicMaterial({color:paint});
  const darkMat = new THREE.MeshBasicMaterial({color:0x14100c});
  const glassMat = new THREE.MeshBasicMaterial({color:0x1c2430});
  const chromeMat = new THREE.MeshBasicMaterial({color:0xcfd6dc});

  const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(1.95,0.42,4.3), paintMat);
  lowerBody.position.y = 0.42; g.add(lowerBody);

  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.14,1.5), paintMat);
  hood.position.set(0,0.66,1.65); g.add(hood);

  const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.85,0.14,1.1), paintMat);
  trunk.position.set(0,0.66,-1.75); g.add(trunk);

  const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.9,0.1), glassMat);
  windshield.position.set(0,1.1,0.85);
  windshield.rotation.x = -0.32;
  g.add(windshield);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.14,1.6), paintMat);
  roof.position.set(0,1.42,-0.15); g.add(roof);

  const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.65,0.85,0.1), glassMat);
  rearGlass.position.set(0,1.08,-1.05);
  rearGlass.rotation.x = 0.4;
  g.add(rearGlass);

  const sideGlassL = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.55,1.5), glassMat);
  sideGlassL.position.set(-0.83,1.18,-0.1); g.add(sideGlassL);
  const sideGlassR = sideGlassL.clone(); sideGlassR.position.x = 0.83; g.add(sideGlassR);

  const grille = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.24,0.06), darkMat);
  grille.position.set(0,0.5,2.14); g.add(grille);

  const headlight = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.1,0.05), new THREE.MeshBasicMaterial({color:0xfff6dd}));
  headlight.position.set(0,0.64,2.15); g.add(headlight);

  const taillight = new THREE.Mesh(new THREE.BoxGeometry(1.75,0.12,0.05), new THREE.MeshBasicMaterial({color:0xdd1f1f}));
  taillight.position.set(0,0.62,-2.14); g.add(taillight);

  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.06,0.28), darkMat);
  spoiler.position.set(0,0.92,-2.05); g.add(spoiler);

  const wheelGeo = new THREE.CylinderGeometry(0.36,0.36,0.3,14);
  const hubMat = chromeMat;
  const tireMat = new THREE.MeshBasicMaterial({color:0x111111});
  [[-0.95,0.36,1.3],[0.95,0.36,1.3],[-0.95,0.36,-1.3],[0.95,0.36,-1.3]].forEach(p=>{
    const w = new THREE.Mesh(wheelGeo, tireMat);
    w.rotation.z = Math.PI/2; w.position.set(p[0],p[1],p[2]); g.add(w);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.32,10), hubMat);
    hub.rotation.z = Math.PI/2; hub.position.set(p[0],p[1],p[2]); g.add(hub);
  });

  // door with hinge pivot (driver side, -x)
  const doorPivot = new THREE.Object3D();
  doorPivot.position.set(-0.97,0.55,0.9);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.85,1.7), paintMat);
  door.position.set(0,0,-0.85);
  doorPivot.add(door);
  g.add(doorPivot);
  g.userData.doorPivot = doorPivot;

  // static interior (visible through the open door during the cinematic)
  const seatMat = new THREE.MeshBasicMaterial({color:0x1c1a22});
  const seatDriver = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.55), seatMat);
  seatDriver.position.set(-0.42,0.75,0.15); g.add(seatDriver);
  const seatPassenger = seatDriver.clone(); seatPassenger.position.x = 0.42; g.add(seatPassenger);
  const dashInterior = new THREE.Mesh(new THREE.BoxGeometry(1.75,0.28,0.5), darkMat);
  dashInterior.position.set(0,0.95,1.15); g.add(dashInterior);
  const wheelInterior = new THREE.Mesh(new THREE.TorusGeometry(0.22,0.03,8,16), darkMat);
  wheelInterior.rotation.x = Math.PI/2.3;
  wheelInterior.position.set(-0.42,1.0,0.85); g.add(wheelInterior);

  return g;
}

const carExt = makeCarExterior();
carExt.position.set(0,0,0);
scene.add(carExt);

let character = null;

// ================= interior view (attached to camera on driving start) =================
const interiorGroup = new THREE.Group();
const dash = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.32,0.55), new THREE.MeshBasicMaterial({color:0x171018}));
dash.position.set(0,-0.62,-0.85); interiorGroup.add(dash);

const hood3rd = new THREE.Mesh(new THREE.BoxGeometry(1.85,0.5,1.6), new THREE.MeshBasicMaterial({color:0xff6a1a}));
hood3rd.position.set(0,-1.05,-1.7); interiorGroup.add(hood3rd);

const pillarGeo = new THREE.BoxGeometry(0.12,1.3,0.12);
const pillarMat = new THREE.MeshBasicMaterial({color:0x100a18});
const pL = new THREE.Mesh(pillarGeo,pillarMat); pL.position.set(-1.3,0.25,-0.95); interiorGroup.add(pL);
const pR = new THREE.Mesh(pillarGeo,pillarMat); pR.position.set(1.3,0.25,-0.95); interiorGroup.add(pR);
const visor = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.1,0.3), new THREE.MeshBasicMaterial({color:0x100a18}));
visor.position.set(0,0.58,-0.95); interiorGroup.add(visor);

const mirrorMat = new THREE.MeshBasicMaterial({color:0x0d0812});
const mirrorL = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.16,0.05), mirrorMat);
mirrorL.position.set(-1.32,0.15,-0.5); interiorGroup.add(mirrorL);
const mirrorR = mirrorL.clone(); mirrorR.position.x = 1.32; interiorGroup.add(mirrorR);

const wheelGroup = new THREE.Group();
wheelGroup.position.set(0,-0.42,-0.72);
const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(0.3,0.045,8,20), new THREE.MeshBasicMaterial({color:0x2a2230}));
wheelRim.rotation.x = Math.PI/2.15;
wheelGroup.add(wheelRim);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.06,10), new THREE.MeshBasicMaterial({color:0x2a2230}));
hub.rotation.x = Math.PI/2; wheelGroup.add(hub);
interiorGroup.add(wheelGroup);

let handColor = 0xffd9b3;
const handGeo = new THREE.SphereGeometry(0.08,8,8);
const handL = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({color:handColor}));
handL.position.set(-0.27,-0.06,0.15);
const handR = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({color:handColor}));
handR.position.set(0.27,-0.06,0.15);
wheelGroup.add(handL, handR);

// ================= state machine =================
let gameState = 'loading';
let stateTime = 0;
const clock = new THREE.Clock();

camera.position.set(-6,2.4,7);
camera.lookAt(0,0.9,0);

const loadingEl = document.getElementById('loading');
const genderEl = document.getElementById('genderSelect');
const skipEl = document.getElementById('skipBtn');
const speedTag = document.getElementById('speedTag');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const gasBtn = document.getElementById('gasBtn');
const brakeBtn = document.getElementById('brakeBtn');

setTimeout(()=>{
  loadingEl.classList.add('hide');
  setTimeout(()=>{ loadingEl.style.display='none'; genderEl.style.display='flex'; gameState='select'; }, 500);
}, 1200);

function choose(genderKey){
  const scheme = SCHEMES[genderKey];
  handColor = scheme.skin;
  handL.material.color.setHex(scheme.skin);
  handR.material.color.setHex(scheme.skin);
  character = makeCharacter(scheme);
  character.position.set(-3,0,3.2);
  character.rotation.y = Math.PI*0.15;
  scene.add(character);
  genderEl.style.display='none';
  skipEl.style.display='block';
  gameState='approach'; stateTime=0;
}
document.getElementById('pickFemale').addEventListener('click', ()=>choose('female'));
document.getElementById('pickMale').addEventListener('click', ()=>choose('male'));

function goToDriving(){
  if(character) character.visible=false;
  carExt.visible=false;
  camera.position.set(0,1.05,0.35);
  camera.rotation.set(0,0,0);
  camera.add(interiorGroup);
  skipEl.style.display='none';
  speedTag.style.display='block';
  [leftBtn,rightBtn,gasBtn,brakeBtn].forEach(b=>b.style.display='flex');
  gameState='driving'; stateTime=0;
}
skipEl.addEventListener('click', goToDriving);

// ================= gas / brake / steer buttons =================
const pressing = { gas:false, brake:false, left:false, right:false };
function bindBtn(el, key){
  const on = e=>{ pressing[key]=true; el.classList.add('active'); e.preventDefault(); };
  const off = ()=>{ pressing[key]=false; el.classList.remove('active'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindBtn(gasBtn,'gas'); bindBtn(brakeBtn,'brake'); bindBtn(leftBtn,'left'); bindBtn(rightBtn,'right');

let speed = 0;
const MAX_SPEED = 30;
const ACCEL = 13;
const BRAKE_DECEL = 24;
const FRICTION = 5.5;
let steer = 0, steerTarget = 0;

// ================= animate =================
function lerpV3(a,b,t){ return a.clone().lerp(b,t); }
const tmpObj = new THREE.Object3D();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  stateTime += dt;
  const elapsed = clock.getElapsedTime();

  skyGroup.position.copy(camera.position);
  ground.position.x = camera.position.x;
  ground.position.z = camera.position.z;

  clusters.forEach(g=>{
    if(g.userData.island){
      g.userData.island.position.y = g.userData.baseY + Math.sin(elapsed+g.userData.bob)*0.6;
    }
  });

  if(gameState==='approach'){
    const dur=1.4, t=Math.min(1,stateTime/dur);
    const p = lerpV3(new THREE.Vector3(-6,2.4,7), new THREE.Vector3(-2.6,1.5,4.2), t);
    camera.position.copy(p);
    const look = lerpV3(new THREE.Vector3(0,0.9,0), new THREE.Vector3(-1,0.9,1), t);
    camera.lookAt(look);
    if(t>=1){ gameState='walk'; stateTime=0; }
  }
  else if(gameState==='walk'){
    const dur=1.3, t=Math.min(1,stateTime/dur);
    if(character){
      const start = new THREE.Vector3(-3,0,3.2), end = new THREE.Vector3(-1.3,0,1.1);
      character.position.x = start.x+(end.x-start.x)*t;
      character.position.z = start.z+(end.z-start.z)*t;
      character.position.y = Math.abs(Math.sin(stateTime*10))*0.05;
    }
    if(t>=1){ gameState='enter'; stateTime=0; }
  }
  else if(gameState==='enter'){
    const dur=1.3, t=Math.min(1,stateTime/dur);
    const doorPivot = carExt.userData.doorPivot;
    if(t<0.5){
      doorPivot.rotation.y = -1.3*(t/0.5);
      if(character){
        character.position.x = -1.3+(-0.97-(-1.3))*(t/0.5);
        character.position.z = 1.1+(0.6-1.1)*(t/0.5);
        character.scale.setScalar(1-0.1*(t/0.5));
      }
    } else {
      if(character) character.visible=false;
      doorPivot.rotation.y = -1.3*(1-((t-0.5)/0.5));
    }
    if(t>=1){ gameState='transition'; stateTime=0; }
  }
  else if(gameState==='transition'){
    const dur=1.5, t=Math.min(1,stateTime/dur);
    const startPos = new THREE.Vector3(-2.6,1.5,4.2);
    const endPos = new THREE.Vector3(0,1.05,0.35);
    camera.position.copy(lerpV3(startPos,endPos,t));
    tmpObj.position.copy(camera.position);
    tmpObj.lookAt(0,1.05,-10);
    camera.quaternion.slerp(tmpObj.quaternion, t);
    if(t>=1){ carExt.visible=false; goToDriving(); }
  }
  else if(gameState==='driving'){
    steerTarget = pressing.left ? -1 : (pressing.right ? 1 : 0);
    steer += (steerTarget-steer)*Math.min(1,dt*6);

    if(pressing.gas) speed = Math.min(MAX_SPEED, speed+ACCEL*dt);
    else if(pressing.brake) speed = Math.max(0, speed-BRAKE_DECEL*dt);
    else speed = Math.max(0, speed-FRICTION*dt);

    camera.position.z -= speed*dt;

    const lateral = steer*(ROAD_WIDTH/2-1.3);
    const cx = curveX(camera.position.z);
    camera.position.x = cx + lateral;

    const dz=1;
    const heading = Math.atan2(curveX(camera.position.z-dz)-curveX(camera.position.z+dz), 2*dz);
    camera.rotation.y = heading + steer*0.05;
    camera.rotation.z = -steer*0.08;
    camera.rotation.x = 0;

    wheelGroup.rotation.z = steer*1.4;
    speedTag.textContent = Math.round(speed*3.6) + ' km/h';

    segments.forEach(seg=>{
      if(seg.zStart > camera.position.z + SEG_LEN){
        const newZStart = frontZ, newZEnd = frontZ-SEG_LEN;
        seg.mesh.geometry.dispose();
        seg.mesh.geometry = buildRoadRibbon(newZStart,newZEnd,SEG_STEPS);
        seg.zStart=newZStart; seg.zEnd=newZEnd; frontZ=newZEnd;
      }
    });
    clusters.forEach(g=>{
      if(g.position.z > camera.position.z+40){
        g.position.z = camera.position.z - (250+Math.random()*180);
        const side = Math.random()<0.5?-1:1;
        const dist = 7+Math.random()*20;
        g.position.x = curveX(g.position.z)+side*dist;
      }
    });
  }

  renderer.render(scene, camera);
}
animate();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
