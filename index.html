<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gorba City - Open World</title>
<meta name="theme-color" content="#0a0a1a">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',Tahoma,sans-serif;touch-action:none;position:fixed;top:0;left:0}

  /* هشدار چرخش گوشی به حالت افقی */
  #rotateOverlay{position:fixed;inset:0;z-index:9999;background:#0a0a1a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  #rotateOverlay .phone-icon{font-size:60px;margin-bottom:15px;animation:rotateAnim 2s infinite ease-in-out}
  #rotateOverlay h2{font-size:20px;color:#ff6b35;margin-bottom:8px}
  #rotateOverlay p{font-size:13px;color:#8888aa;max-width:260px;line-height:1.5}
  @keyframes rotateAnim{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-90deg)}}

  #loader{position:fixed;inset:0;z-index:999;background:linear-gradient(180deg,#0a0a1a,#1a1a3e);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .8s}
  #loader.hidden{opacity:0;pointer-events:none}
  #loader h1{font-size:clamp(28px,5vw,52px);font-weight:900;background:linear-gradient(135deg,#ff6b35,#f7931e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
  #loader .sub{font-size:clamp(10px,1.5vw,16px);color:#6666aa;letter-spacing:6px;text-transform:uppercase;margin-bottom:30px}
  .loader-bar-wrap{width:min(300px,50%);height:4px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden}
  .loader-bar-fill{width:0%;height:100%;background:linear-gradient(90deg,#ff6b35,#f7931e);border-radius:10px;transition:width .2s}
  #loaderPercent{margin-top:12px;font-size:12px;color:#444466;letter-spacing:1px}
  #loaderTips{margin-top:20px;font-size:11px;color:#555577;text-align:center;max-width:280px;line-height:1.6;min-height:40px}

  #hud{position:fixed;top:0;left:0;right:0;padding:8px 14px;z-index:20;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
  .hud-left{display:flex;flex-direction:column;gap:2px}
  .hud-item{display:flex;align-items:center;gap:6px;color:#fff;font-size:clamp(9px,1.2vw,12px);text-shadow:0 2px 8px rgba(0,0,0,.9);font-weight:600}
  .hud-item .icon{font-size:12px}
  .bar-wrap{width:clamp(50px,12vw,100px);height:4px;background:rgba(0,0,0,.6);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
  .bar-fill{height:100%;border-radius:10px;transition:width .3s}
  .bar-fill.health{background:linear-gradient(90deg,#ff1744,#ff5252)}
  .bar-fill.hunger{background:linear-gradient(90deg,#ff9100,#ffab40)}
  .bar-fill.thirst{background:linear-gradient(90deg,#2979ff,#40c4ff)}
  .hud-right{text-align:right;color:#fff;font-size:clamp(8px,1vw,11px);text-shadow:0 2px 8px rgba(0,0,0,.9);opacity:.7;font-weight:300;letter-spacing:.5px}
  .hud-right .time{font-size:clamp(12px,1.8vw,18px);font-weight:700;color:#fff;opacity:1}

  #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;opacity:.5}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.8)}
  #crosshair::before{width:1px;height:12px;top:50%;left:50%;transform:translate(-50%,-50%)}
  #crosshair::after{width:12px;height:1px;top:50%;left:50%;transform:translate(-50%,-50%)}
  #crosshair .dot{position:absolute;top:50%;left:50%;width:3px;height:3px;background:#ff3333;border-radius:50%;transform:translate(-50%,-50%)}

  #lookArea{position:fixed;top:0;right:0;width:60%;height:100%;z-index:5;touch-action:none}
  #joystickArea{position:fixed;bottom:clamp(14px,3vh,30px);left:clamp(12px,2vw,25px);width:clamp(80px,14vw,110px);height:clamp(80px,14vw,110px);border-radius:50%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);z-index:10;touch-action:none;backdrop-filter:blur(6px);box-shadow:0 0 40px rgba(0,0,0,.6)}
  #joyKnob{position:absolute;width:clamp(32px,5.5vw,44px);height:clamp(32px,5.5vw,44px);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,.05));top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1)}

  #actionBtns{position:fixed;bottom:clamp(14px,3vh,30px);right:clamp(10px,2vw,25px);z-index:10;display:flex;flex-direction:column;gap:8px;align-items:center}
  .action-btn{width:clamp(46px,8vw,58px);height:clamp(46px,8vw,58px);border-radius:50%;border:1.5px solid rgba(255,255,255,.12);color:#fff;font-size:clamp(9px,1.3vw,12px);font-weight:700;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;backdrop-filter:blur(6px);text-shadow:0 2px 8px rgba(0,0,0,.5);transition:all .1s}
  .action-btn:active{transform:scale(.88)}
  #jumpBtn{background:rgba(255,100,50,.15);border-color:rgba(255,150,80,.2)}
  #sprintBtn{background:rgba(50,150,255,.1);border-color:rgba(50,150,255,.15);font-size:clamp(12px,1.6vw,18px)}
  #sprintBtn.active{background:rgba(50,150,255,.3);border-color:rgba(50,150,255,.5)}

  #lootBtn{position:fixed;bottom:20%;right:15%;width:60px;height:60px;border-radius:50%;background:rgba(255,165,0,.3);border:2px solid #ffa500;color:#fff;font-size:22px;display:none;align-items:center;justify-content:center;z-index:15;backdrop-filter:blur(5px);box-shadow:0 0 15px rgba(255,165,0,.5)}

  #invBtn{position:fixed;top:55px;right:10px;width:clamp(36px,5.5vw,44px);height:clamp(36px,5.5vw,44px);border-radius:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:clamp(16px,2.5vw,22px);z-index:15;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);touch-action:none}
  #inventory{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);display:none;flex-direction:column;padding:16px 14px;color:#fff}
  #inventory.open{display:flex}
  #invHeader{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:12px}
  #invHeader h2{font-size:clamp(16px,2.5vw,22px);font-weight:300;letter-spacing:2px}
  #invHeader h2 span{color:#ff6b35}
  #invClose{font-size:clamp(20px,3vw,28px);background:none;border:none;color:#fff;opacity:.5;padding:0 10px;touch-action:none}
  #invGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;overflow-y:auto;padding-bottom:8px;align-content:start}
  .inv-slot{aspect-ratio:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(20px,3vw,30px);color:#888;position:relative}
  .inv-slot.has-item{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .inv-slot .count{position:absolute;bottom:2px;right:6px;font-size:clamp(8px,1vw,11px);color:#aaa;font-weight:700}
  .inv-slot .name{font-size:clamp(6px,.8vw,9px);color:#888;margin-top:2px}
  #invStats{padding:10px 0 0 0;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-around;font-size:clamp(10px,1.2vw,13px);color:#888}
  #invStats span{color:#fff;font-weight:600}
</style>
</head>
<body>

<div id="rotateOverlay">
  <div class="phone-icon">📱</div>
  <h2>لطفاً گوشی خود را بچرخانید</h2>
  <p>برای تجربه بهتر جهان باز Gorba City، دستگاه خود را در حالت افقی (Landscape) قرار دهید.</p>
</div>

<div id="loader">
  <h1>GORBA CITY</h1>
  <div class="sub">Open World</div>
  <div class="loader-bar-wrap"><div class="loader-bar-fill" id="loaderFill"></div></div>
  <div id="loaderPercent">0%</div>
  <div id="loaderTips">🌍 در حال آماده‌سازی جهان...</div>
</div>

<div id="hud">
  <div class="hud-left">
    <div class="hud-item"><span class="icon">❤️</span><div class="bar-wrap"><div class="bar-fill health" style="width:100%"></div></div></div>
    <div class="hud-item"><span class="icon">🍖</span><div class="bar-wrap"><div class="bar-fill hunger" style="width:100%"></div></div></div>
    <div class="hud-item"><span class="icon">💧</span><div class="bar-wrap"><div class="bar-fill thirst" style="width:100%"></div></div></div>
  </div>
  <div class="hud-right">
    <div class="time" id="gameTime">12:00</div>
    <div>🌆 Gorba City</div>
  </div>
</div>

<div id="crosshair"><div class="dot"></div></div>
<div id="lootBtn">📦</div>
<div id="lookArea"></div>
<div id="joystickArea"><div id="joyKnob"></div></div>
<div id="actionBtns">
  <div class="action-btn" id="jumpBtn">پرش</div>
  <div class="action-btn" id="sprintBtn">🏃</div>
</div>
<div id="invBtn">🎒</div>

<div id="inventory">
  <div id="invHeader"><h2>🎒 <span>کیف</span></h2><button id="invClose">✕</button></div>
  <div id="invGrid"></div>
  <div id="invStats">
    <div>وزن: <span id="invWeight">0</span> / 20</div>
    <div>آیتم‌ها: <span id="invCount">0</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- ORIENTATION CHECK ---
const rotateOverlay = document.getElementById('rotateOverlay');
function checkOrientation() {
  if (window.innerHeight > window.innerWidth) {
    rotateOverlay.style.display = 'flex';
  } else {
    rotateOverlay.style.display = 'none';
  }
}
window.addEventListener('resize', checkOrientation);
checkOrientation();

// --- LOADER & INVENTORY ---
let loadProgress = 0;
const updateLoader = (v) => {
  loadProgress = Math.min(v, 100);
  document.getElementById('loaderFill').style.width = loadProgress + '%';
  document.getElementById('loaderPercent').textContent = Math.floor(loadProgress) + '%';
};

const inventory = {
  items: [],
  maxWeight: 20,
  addItem(name, emoji, weight = 1) {
    const existing = this.items.find(i => i.name === name);
    if (existing) { existing.count++; return true; }
    if (this.getTotalWeight() + weight > this.maxWeight) return false;
    this.items.push({ name, emoji, weight, count: 1 });
    return true;
  },
  getTotalWeight() { return this.items.reduce((s, i) => s + (i.weight * i.count), 0); },
  getTotalCount() { return this.items.reduce((s, i) => s + i.count, 0); }
};

// --- THREE.JS SETUP ---
updateLoader(10);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6a9ec4);
scene.fog = new THREE.FogExp2(0x6a9ec4, 0.008);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- LIGHTING ---
updateLoader(30);
const ambient = new THREE.AmbientLight(0x557799, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
sun.position.set(50, 80, -30);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 150;
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

// --- PLAYER BODY (First-Person Body View) ---
updateLoader(50);
const playerGroup = new THREE.Group();
scene.add(playerGroup);

// Torso / Jacket
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x224466, roughness: 0.7 });
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), bodyMat);
torso.position.y = 1.1;
torso.castShadow = true;
playerGroup.add(torso);

// Legs & Shoes
const legMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.8 });
const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });

const leftLegGroup = new THREE.Group();
const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.18), legMat);
leftLeg.position.y = -0.35;
const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.28), shoeMat);
leftShoe.position.set(0, -0.66, -0.04);
leftLegGroup.add(leftLeg, leftShoe);
leftLegGroup.position.set(-0.15, 0.7, 0);

const rightLegGroup = new THREE.Group();
const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.18), legMat);
rightLeg.position.y = -0.35;
const rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.28), shoeMat);
rightShoe.position.set(0, -0.66, -0.04);
rightLegGroup.add(rightLeg, rightShoe);
rightLegGroup.position.set(0.15, 0.7, 0);

playerGroup.add(leftLegGroup, rightLegGroup);

// --- WORLD GENERATION SYSTEM (10 steps check, 100 steps dynamic world) ---
updateLoader(70);
const CHUNK_SIZE = 20;
const VIEW_DISTANCE = 100; // 100 steps radius
const activeChunks = new Map();
const lootCrates = [];

const groundGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a7c3a, roughness: 0.9 });
const crateGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
const crateMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 });

function spawnChunk(cx, cz) {
  const key = `${cx},${cz}`;
  if (activeChunks.has(key)) return;

  const chunkGroup = new THREE.Group();
  const posX = cx * CHUNK_SIZE;
  const posZ = cz * CHUNK_SIZE;

  // Ground Tile
  const tile = new THREE.Mesh(groundGeo, groundMat);
  tile.rotation.x = -Math.PI / 2;
  tile.position.set(posX, 0, posZ);
  tile.receiveShadow = true;
  chunkGroup.add(tile);

  // Random Buildings & Trees in Chunk
  const seed = Math.sin(cx * 12.9898 + cz * 78.233) * 43758.5453;
  if (Math.abs(cx) > 0 || Math.abs(cz) > 0) {
    if ((seed % 1) > 0.4) {
      // Building
      const bH = 4 + (seed % 6);
      const bGeo = new THREE.BoxGeometry(4, bH, 4);
      const bMat = new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 0.5 });
      const building = new THREE.Mesh(bGeo, bMat);
      building.position.set(posX + (seed % 5) - 2, bH / 2, posZ + ((seed * 2) % 5) - 2);
      building.castShadow = true;
      building.receiveShadow = true;
      chunkGroup.add(building);
    }

    // Loot Crate
    if ((seed % 1) > 0.6) {
      const crate = new THREE.Mesh(crateGeo, crateMat);
      const cX = posX + (seed % 6) - 3;
      const cZ = posZ + ((seed * 3) % 6) - 3;
      crate.position.set(cX, 0.4, cZ);
      crate.castShadow = true;
      chunkGroup.add(crate);
      lootCrates.push({ mesh: crate, chunkKey: key, id: Math.random() });
    }
  }

  scene.add(chunkGroup);
  activeChunks.set(key, chunkGroup);
}

function updateWorld(playerX, playerZ) {
  const currentChunkX = Math.floor((playerX + CHUNK_SIZE / 2) / CHUNK_SIZE);
  const currentChunkZ = Math.floor((playerZ + CHUNK_SIZE / 2) / CHUNK_SIZE);
  const radius = Math.ceil(VIEW_DISTANCE / CHUNK_SIZE);

  for (let x = -radius; x <= radius; x++) {
    for (let z = -radius; z <= radius; z++) {
      spawnChunk(currentChunkX + x, currentChunkZ + z);
    }
  }
}

// --- CONTROLS & PLAYER LOGIC ---
updateLoader(90);
const player = { x: 0, z: 0, y: 0, velY: 0, yaw: 0, pitch: 0, onGround: true };
const EYE_HEIGHT = 1.6;
let sprinting = false;
let walkAnimTime = 0;

// Look Controls
const lookArea = document.getElementById('lookArea');
let looking = false, lastX = 0, lastY = 0;
lookArea.addEventListener('pointerdown', e => { looking = true; lastX = e.clientX; lastY = e.clientY; lookArea.setPointerCapture(e.pointerId); });
lookArea.addEventListener('pointerup', () => looking = false);
lookArea.addEventListener('pointermove', e => {
  if (!looking) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  player.yaw -= dx * 0.004;
  player.pitch -= dy * 0.004;
  player.pitch = Math.max(-1.4, Math.min(1.2, player.pitch)); // نگاه کامل به پایین برای دیدن بدن
});

// Joystick Controls
const joystickArea = document.getElementById('joystickArea');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false, joyCenter = { x: 0, y: 0 }, joyVec = { x: 0, y: 0 };
const JOY_MAX = 40;

joystickArea.addEventListener('pointerdown', e => {
  joyActive = true;
  const r = joystickArea.getBoundingClientRect();
  joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  joystickArea.setPointerCapture(e.pointerId);
});
joystickArea.addEventListener('pointerup', () => { joyActive = false; joyVec = { x: 0, y: 0 }; joyKnob.style.transform = 'translate(-50%,-50%)'; });
joystickArea.addEventListener('pointermove', e => {
  if (!joyActive) return;
  let dx = e.clientX - joyCenter.x, dy = e.clientY - joyCenter.y;
  const len = Math.hypot(dx, dy);
  if (len > JOY_MAX) { dx = (dx / len) * JOY_MAX; dy = (dy / len) * JOY_MAX; }
  joyKnob.style.transform = `translate(${-50 + (dx / JOY_MAX) * 50}%,${-50 + (dy / JOY_MAX) * 50}%)`;
  joyVec = { x: dx / JOY_MAX, y: dy / JOY_MAX };
});

document.getElementById('jumpBtn').addEventListener('pointerdown', () => {
  if (player.onGround) { player.velY = 7; player.onGround = false; }
});
document.getElementById('sprintBtn').addEventListener('pointerdown', () => {
  sprinting = !sprinting;
  document.getElementById('sprintBtn').classList.toggle('active');
});

// Loot Interaction
const lootBtn = document.getElementById('lootBtn');
let currentTargetCrate = null;

lootBtn.addEventListener('click', () => {
  if (currentTargetCrate) {
    const items = [{ name: 'کنسرو غذا', emoji: '🥫' }, { name: 'بطری آب', emoji: '🍾' }, { name: 'باندج', emoji: '🩹' }];
    const picked = items[Math.floor(Math.random() * items.length)];
    if (inventory.addItem(picked.name, picked.emoji)) {
      scene.remove(currentTargetCrate.mesh);
      const idx = lootCrates.indexOf(currentTargetCrate);
      if (idx > -1) lootCrates.splice(idx, 1);
      lootBtn.style.display = 'none';
      currentTargetCrate = null;
    }
  }
});

// --- GAME LOOP ---
const clock = new THREE.Clock();
let stepCounter = 0;
let lastStepPos = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  // Movement Logic
  const speed = sprinting ? 8 : 4.5;
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
  const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);

  const moveX = joyVec.x, moveZ = -joyVec.y;
  const mvx = (forward.x * moveZ + right.x * moveX) * speed * dt;
  const mvz = (forward.z * moveZ + right.z * moveX) * speed * dt;

  player.x += mvx;
  player.z += mvz;

  // Physics & Gravity
  player.velY -= 20 * dt;
  player.y += player.velY * dt;
  if (player.y <= 0) { player.y = 0; player.velY = 0; player.onGround = true; }

  // 10 Steps Check -> Dynamic Generation up to 100 Steps
  const curPos = new THREE.Vector3(player.x, 0, player.z);
  if (curPos.distanceTo(lastStepPos) >= 5) { // هر ۱۰ قدم
    lastStepPos.copy(curPos);
    updateWorld(player.x, player.z);
  }

  // Player Body Position & Leg Animation
  playerGroup.position.set(player.x, player.y, player.z);
  playerGroup.rotation.y = player.yaw;

  const isMoving = Math.hypot(mvx, mvz) > 0.001;
  if (isMoving && player.onGround) {
    walkAnimTime += dt * (sprinting ? 12 : 8);
    leftLegGroup.rotation.x = Math.sin(walkAnimTime) * 0.6;
    rightLegGroup.rotation.x = -Math.sin(walkAnimTime) * 0.6;
  } else {
    leftLegGroup.rotation.x = 0;
    rightLegGroup.rotation.x = 0;
  }

  // Camera Position (First Person Body View)
  camera.position.set(player.x, player.y + EYE_HEIGHT, player.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // Raycast / Proximity check for Loot Crates
  let nearCrate = null;
  for (let c of lootCrates) {
    if (c.mesh.position.distanceTo(playerGroup.position) < 2.2) {
      nearCrate = c;
      break;
    }
  }
  if (nearCrate) {
    currentTargetCrate = nearCrate;
    lootBtn.style.display = 'flex';
  } else {
    currentTargetCrate = null;
    lootBtn.style.display = 'none';
  }

  renderer.render(scene, camera);
}

// --- START GAME ---
updateLoader(100);
setTimeout(() => {
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('hud').style.display = 'flex';
  updateWorld(0, 0);
  animate();
}, 500);

// --- INVENTORY UI ---
function updateInventoryUI() {
  const grid = document.getElementById('invGrid');
  grid.innerHTML = '';
  inventory.items.forEach(item => {
    const slot = document.createElement('div');
    slot.className = 'inv-slot has-item';
    slot.innerHTML = `${item.emoji}<span class="count">${item.count}</span><span class="name">${item.name}</span>`;
    grid.appendChild(slot);
  });
  document.getElementById('invWeight').textContent = inventory.getTotalWeight().toFixed(1);
  document.getElementById('invCount').textContent = inventory.getTotalCount();
}
document.getElementById('invBtn').addEventListener('click', () => {
  document.getElementById('inventory').classList.toggle('open');
  updateInventoryUI();
});
document.getElementById('invClose').addEventListener('click', () => {
  document.getElementById('inventory').classList.remove('open');
});
</script>
