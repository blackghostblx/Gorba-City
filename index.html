<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gorba City - First Person Drive</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        /* دکمه‌های کنترل لمسی روی گوشی */
        .touch-controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            touch-action: manipulation;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
    </style>
    <!-- Three.js & FBX Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- کنترل‌های لمسی موبایل -->
    <div class="touch-controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-brake">🛑</div>
            <div class="btn" id="btn-gas">⚡</div>
        </div>
    </div>

    <script>
        // --- ۱. تنظیمات صحنه و دوربین ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        scene.background = new THREE.Color(0x1a0b2e);
        scene.fog = new THREE.FogExp2(0xff5533, 0.005);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- ۲. نورپردازی ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xff7733, 2.0);
        sunLight.position.set(0, 20, -300);
        scene.add(sunLight);

        // خورشید افق
        const sunGeo = new THREE.SphereGeometry(30, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(0, 10, -400);
        scene.add(sun);

        // --- ۳. بارگذاری مدل ماشین خودت ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        const fbxLoader = new THREE.FBXLoader();
        // بارگذاری فایل FBX دقیقاً بر اساس اسمی که فرستادی
        fbxLoader.load('_car.001_opada.fbx', (fbx) => {
            fbx.scale.set(0.01, 0.01, 0.01); // در صورت نیاز اسکیل را تنظیم کن
            fbx.rotation.y = Math.PI; // چرخاندن ماشین به سمت جلو
            carGroup.add(fbx);
        }, undefined, (err) => {
            console.error('خطا در لود فایل FBX:', err);
        });

        // --- ۴. تنظیم دقیق زاویه دید از داخل کابین (First Person) ---
        // موقعیت دوربین داخل ماشین (صندلی راننده)
        // اگر لازم شد این اعداد را بسته به ابعاد دقیق فایلت کمی تغییر بده:
        const COCKPIT_OFFSET = new THREE.Vector3(-0.35, 1.2, -0.2); 

        // --- ۵. ساخت جاده و محیط ---
        const ROAD_WIDTH = 14;
        const CHUNK_SIZE = 100;
        const VISIBLE_CHUNKS = 6;
        const chunks = [];

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.6 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

        function createChunk(zPosition) {
            const chunk = new THREE.Group();
            chunk.position.z = zPosition;

            // سطح جاده
            const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, CHUNK_SIZE);
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            chunk.add(road);

            // خط کشی جاده
            for (let i = -CHUNK_SIZE / 2; i < CHUNK_SIZE / 2; i += 12) {
                const lineGeo = new THREE.PlaneGeometry(0.25, 5);
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.02, i);
                chunk.add(line);
            }

            scene.add(chunk);
            return chunk;
        }

        for (let i = 0; i < VISIBLE_CHUNKS; i++) {
            chunks.push(createChunk(-i * CHUNK_SIZE));
        }

        // --- ۶. سیستم کنترل (کیبورد + لمسی) ---
        const input = { forward: false, backward: false, left: false, right: false };

        // کیبورد
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') input.forward = true;
            if (e.key === 's' || e.key === 'ArrowDown') input.backward = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') input.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') input.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') input.forward = false;
            if (e.key === 's' || e.key === 'ArrowDown') input.backward = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
        });

        // دکمه‌های لمسی
        const setupTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
            el.addEventListener('mousedown', () => input[key] = true);
            el.addEventListener('mouseup', () => input[key] = false);
        };
        setupTouch('btn-gas', 'forward');
        setupTouch('btn-brake', 'backward');
        setupTouch('btn-left', 'left');
        setupTouch('btn-right', 'right');

        // --- ۷. فیزیک و حرکت ---
        let speed = 0;
        const maxSpeed = 1.5;
        const accel = 0.025;
        const friction = 0.985;
        let steeringAngle = 0;

        function animate() {
            requestAnimationFrame(animate);

            // محاسبه سرعت
            if (input.forward) speed = Math.min(speed + accel, maxSpeed);
            else if (input.backward) speed = Math.max(speed - accel, -maxSpeed / 3);
            else speed *= friction;

            // حرکت به جلو
            carGroup.position.z -= speed;

            // فرمان‌پذیری و انحراف ماشین
            if (Math.abs(speed) > 0.02) {
                if (input.left && carGroup.position.x > -ROAD_WIDTH / 2 + 1.8) {
                    carGroup.position.x -= 0.08 * (speed / maxSpeed);
                    steeringAngle = THREE.MathUtils.lerp(steeringAngle, 0.08, 0.1);
                } else if (input.right && carGroup.position.x < ROAD_WIDTH / 2 - 1.8) {
                    carGroup.position.x += 0.08 * (speed / maxSpeed);
                    steeringAngle = THREE.MathUtils.lerp(steeringAngle, -0.08, 0.1);
                } else {
                    steeringAngle = THREE.MathUtils.lerp(steeringAngle, 0, 0.1);
                }
            }
            carGroup.rotation.y = steeringAngle;

            // --- قرار دادن دوربین دقیقاً در چشم راننده (Cockpit) ---
            camera.position.copy(carGroup.position).add(COCKPIT_OFFSET);
            // نگاه به انتهای جاده از داخل ماشین
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1.1, carGroup.position.z - 20);

            // جابه‌جایی بی‌انتهای خورشید و جاده
            sun.position.z = carGroup.position.z - 400;
            sunLight.position.z = carGroup.position.z - 300;

            chunks.forEach((chunk) => {
                if (chunk.position.z > carGroup.position.z + CHUNK_SIZE) {
                    chunk.position.z -= VISIBLE_CHUNKS * CHUNK_SIZE;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
