<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفر بی‌انتها در غروب</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
    <!-- Three.js and Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1>INFINITE SUNSET DRIVE</h1>
        <p>برای حرکت کلیک کنید و کلیدهای W A S D یا فلش‌ها را فشار دهید</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- تنظیمات اصلی صحنه ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // مه سینمایی غروب
        const fogColor = new THREE.Color(0xff5533);
        scene.background = new THREE.Color(0x2c1635);
        scene.fog = new THREE.FogExp2(0xef5d3b, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- نورپردازی غروب (Sunset Lighting) ---
        const ambientLight = new THREE.AmbientLight(0x382843, 1.2);
        scene.add(ambientLight);

        // نور اصلی خورشید غروب
        const sunLight = new THREE.DirectionalLight(0xff7700, 2.5);
        sunLight.position.set(0, 20, -300);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // خورشید رویایی (یک کره درخشان در افق)
        const sunGeo = new THREE.SphereGeometry(40, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(0, 15, -400);
        scene.add(sun);

        // --- ماشین (Player Car) ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        // ایجاد یک ماشین هنری پیش‌فرض (در صورت عدم بارگذاری فایل FBX)
        function createDefaultCar() {
            const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.1, metalness: 0.9 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.2, -0.2);
            carGroup.add(cabin);

            // چراغ‌های پشت ماشین
            const tailLightGeo = new THREE.BoxGeometry(0.4, 0.1, 0.1);
            const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
            const tailLeft = new THREE.Mesh(tailLightGeo, tailLightMat);
            tailLeft.position.set(-0.7, 0.7, 2.01);
            const tailRight = tailLeft.clone();
            tailRight.position.x = 0.7;
            carGroup.add(tailLeft, tailRight);
        }

        // بارگذاری فایل FBX (اگر فایل car.fbx در کنار این HTML باشد اجرا می‌شود)
        const fbxLoader = new THREE.FBXLoader();
        fbxLoader.load('_car.001_opada.fbx', (fbx) => {
            fbx.scale.set(0.01, 0.01, 0.01); // تنظیم مقیاس مدل
            fbx.traverse((child) => {
                if (child.isMesh) child.castShadow = true;
            });
            carGroup.add(fbx);
        }, undefined, () => {
            // در صورت نبودن فایل، ماشین پیش‌فرض هنری ساخته می‌شود
            createDefaultCar();
        });

        // --- تولید جاده و محیط بی‌انتها ---
        const ROAD_WIDTH = 12;
        const CHUNK_SIZE = 100;
        const VISIBLE_CHUNKS = 8;
        const chunks = [];

        // متریال‌ها
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x2a1835, roughness: 0.9, flatShading: true });
        const treeMat = new THREE.MeshStandardMaterial({ color: 0x142018, flatShading: true });

        function createChunk(zPosition) {
            const chunk = new THREE.Group();
            chunk.position.z = zPosition;

            // جاده
            const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, CHUNK_SIZE);
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            chunk.add(road);

            // خطوط وسط جاده
            for (let i = -CHUNK_SIZE / 2; i < CHUNK_SIZE / 2; i += 10) {
                const lineGeo = new THREE.PlaneGeometry(0.3, 4);
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.02, i);
                chunk.add(line);
            }

            // کوه‌ها و مناظر دو طرف جاده (Stylized Art)
            for (let side of [-1, 1]) {
                // کوه‌ها
                const mountainGeo = new THREE.ConeGeometry(20 + Math.random() * 15, 40 + Math.random() * 30, 4);
                const mountain = new THREE.Mesh(mountainGeo, mountainMat);
                mountain.position.set(side * (30 + Math.random() * 20), 15, (Math.random() - 0.5) * CHUNK_SIZE);
                chunk.add(mountain);

                // درخت‌ها
                for (let t = 0; t < 5; t++) {
                    const treeGeo = new THREE.ConeGeometry(2 + Math.random() * 2, 8 + Math.random() * 4, 5);
                    const tree = new THREE.Mesh(treeGeo, treeMat);
                    tree.position.set(side * (10 + Math.random() * 15), 4, (Math.random() - 0.5) * CHUNK_SIZE);
                    chunk.add(tree);
                }
            }

            scene.add(chunk);
            return chunk;
        }

        // مقداردهی اولیه چانک‌ها
        for (let i = 0; i < VISIBLE_CHUNKS; i++) {
            chunks.push(createChunk(-i * CHUNK_SIZE));
        }

        // --- کنترل‌ها و حرکت ---
        const keys = { Forward: false, Backward: false, Left: false, Right: false };
        let speed = 0;
        const maxSpeed = 1.2;
        const accel = 0.02;
        const friction = 0.98;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.Forward = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.Backward = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.Left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.Right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.Forward = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.Backward = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.Left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.Right = false;
        });

        // --- حلقه انیمیشن و رندر ---
        function animate() {
            requestAnimationFrame(animate);

            // مدیریت سرعت
            if (keys.Forward) speed = Math.min(speed + accel, maxSpeed);
            else if (keys.Backward) speed = Math.max(speed - accel, -maxSpeed / 2);
            else speed *= friction;

            // حرکت ماشین به جلو
            carGroup.position.z -= speed;

            // فرمان‌پذیری چپ و راست
            if (Math.abs(speed) > 0.05) {
                if (keys.Left && carGroup.position.x > -ROAD_WIDTH / 2 + 1.5) carGroup.position.x -= 0.1;
                if (keys.Right && carGroup.position.x < ROAD_WIDTH / 2 - 1.5) carGroup.position.x += 0.1;
            }

            // تعقیب دوربین پشت ماشین (Third-Person View)
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, carGroup.position.x, 0.05);
            camera.position.y = carGroup.position.y + 3.5;
            camera.position.z = carGroup.position.z + 8;
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z - 10);

            // انتقال خورشید همراه ماشین برای بی‌انتها ماندن غروب
            sun.position.z = carGroup.position.z - 400;
            sunLight.position.z = carGroup.position.z - 300;

            // مدیریت بی‌انتهایی جاده (Endless Road Generation)
            chunks.forEach((chunk) => {
                if (chunk.position.z > carGroup.position.z + CHUNK_SIZE) {
                    chunk.position.z -= VISIBLE_CHUNKS * CHUNK_SIZE;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        // تنظیم اندازه صفحه هنگام Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
