<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gorba City - Auto Camera Driving</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}

  /* ROTATE PHONE OVERLAY */
  #rotateOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
  #rotateOverlay h2{margin-bottom:10px;font-size:20px;color:#ff9900}
  #rotateOverlay p{font-size:14px;color:#ccc;margin-bottom:20px}
  #startBtn{background:#ff9900;border:none;color:#fff;padding:12px 25px;border-radius:20px;font-weight:bold;font-size:16px;cursor:pointer}

  #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;color:rgba(255,255,255,0.7);font-size:18px;pointer-events:none}
  #lookArea{position:fixed;top:0;right:0;width:50%;height:100%;z-index:10;touch-action:none}

  /* WALK D-PAD */
  #dpad{position:fixed;bottom:20px;left:20px;width:110px;height:110px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px}
  .dbtn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:16px;touch-action:none}
  .dbtn:active{background:rgba(255,255,255,0.4)}
  #btnUp{grid-column:2;grid-row:1}
  #btnLeft{grid-column:1;grid-row:2}
  #btnJump{grid-column:2;grid-row:2;background:rgba(255,255,255,0.25);border-radius:50%}
  #btnRight{grid-column:3;grid-row:2}
  #btnDown{grid-column:2;grid-row:3}

  /* CAR CONTROLS */
  #enterCarBtn{position:fixed;bottom:140px;left:25px;z-index:25;background:rgba(255,165,0,0.85);border:none;color:#fff;padding:12px 18px;border-radius:25px;font-weight:bold;display:none;font-size:14px;box-shadow:0 0 15px rgba(255,165,0,0.4)}
  
  #carSteering{position:fixed;bottom:25px;left:25px;z-index:25;display:none;gap:15px}
  .steerBtn{width:65px;height:65px;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.5);border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold}
  
  #carPedals{position:fixed;bottom:20px;right:25px;z-index:25;display:none;flex-direction:column;gap:10px}
  .pedal{width:65px;height:65px;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.5);border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold}
  .pedal:active{background:rgba(255,255,255,0.5)}

  #speedometerUI{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:25;background:rgba(0,0,0,0.85);color:#00ffcc;padding:8px 20px;border-radius:20px;font-family:monospace;font-size:16px;border:1px solid #00ffcc;display:none}

  /* HOTBAR */
  #hudContainer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
  #hotbar{display:flex;background:rgba(0,0,0,0.7);border:2px solid #444;padding:2px;gap:2px;border-radius:6px;pointer-events:auto}
  .slot{width:38px;height:38px;background:rgba(255,255,255,0.08);border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;position:relative;cursor:pointer}
  .slot.active{border-color:#ff9900;background:rgba(255,255,255,0.2)}
</style>
</head>
<body>

<div id="rotateOverlay">
  <h2>🔄 لطفا صفحه گوشی را افقی کنید</h2>
  <p>برای بهترین تجربه بازی، چرخش خودکار گوشی را فعال کرده و آن را افقی بگیرید.</p>
  <button id="startBtn">شروع بازی 🎮</button>
</div>

<div id="crosshair">+</div>
<div id="lookArea"></div>
<div id="speedometerUI"><span id="speedVal">0</span> KM/H | <span id="engineLvlVal">LVL 1</span></div>

<!-- WALK D-PAD -->
<div id="dpad">
  <div class="dbtn" id="btnUp">▲</div>
  <div class="dbtn" id="btnLeft">◄</div>
  <div class="dbtn" id="btnJump">●</div>
  <div class="dbtn" id="btnRight">►</div>
  <div class="dbtn" id="btnDown">▼</div>
</div>

<!-- CAR UI -->
<button id="enterCarBtn">🚗 نشستن در ماشین</button>
<div id="carSteering">
  <div class="steerBtn" id="steerLeft">◄</div>
  <div class="steerBtn" id="steerRight">►</div>
</div>
<div id="carPedals">
  <div class="pedal" id="gasBtn">⬆️</div>
  <div class="pedal" id="brakeBtn">⬇️</div>
</div>

<!-- HOTBAR -->
<div id="hudContainer">
  <div id="hotbar">
    <div class="slot active" data-idx="0">🪓</div>
    <div class="slot" data-idx="1"></div>
    <div class="slot" data-idx="2"></div>
    <div class="slot" data-idx="3"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('rotateOverlay').style.display = 'none';
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee);
scene.fog = new THREE.FogExp2(0x7ec0ee, 0.005);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 800);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// LIGHTS
const ambient = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfffaed, 1.2);
sun.position.set(100, 150, 50);
sun.castShadow = true;
scene.add(sun);

// INFINITE ROAD & TERRAIN SYSTEM
const chunks = new Map();
const chunkSize = 120;
const groundColors = [0x3d6b2c, 0x427330, 0x386128, 0x487c35];
const grassColors = [0x55aa33, 0x66bb44, 0x449922, 0x77cc55];

function createChunk(cx, cz) {
  const group = new THREE.Group();
  
  const color = groundColors[Math.abs(cx + cz) % groundColors.length];
  const gGeo = new THREE.PlaneGeometry(chunkSize, chunkSize);
  const gMat = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  const ground = new THREE.Mesh(gGeo, gMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(cx * chunkSize, 0, cz * chunkSize);
  ground.receiveShadow = true;
  group.add(ground);

  const roadPoints = [];
  for (let z = -chunkSize/2; z <= chunkSize/2; z += 15) {
    const worldZ = cz * chunkSize + z;
    const worldX = cx * chunkSize + Math.sin(worldZ * 0.02) * 20;
    roadPoints.push(new THREE.Vector3(worldX, 0.03, worldZ));
  }
  const curve = new THREE.CatmullRomCurve3(roadPoints);
  const roadGeo = new THREE.TubeGeometry(curve, 15, 4.5, 8, false);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.scale.set(1, 0.01, 1);
  road.receiveShadow = true;
  group.add(road);

  const grassGeo = new THREE.ConeGeometry(0.15, 0.6, 3);
  for (let i = 0; i < 45; i++) {
    const gColor = grassColors[Math.floor(Math.random() * grassColors.length)];
    const grassMat = new THREE.MeshBasicMaterial({ color: gColor });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    const rx = (Math.random() - 0.5) * chunkSize + cx * chunkSize;
    const rz = (Math.random() - 0.5) * chunkSize + cz * chunkSize;
    grass.position.set(rx, 0.3, rz);
    group.add(grass);
  }

  scene.add(group);
  return group;
}

function updateChunks(playerX, playerZ) {
  const currentCX = Math.floor((playerX + chunkSize / 2) / chunkSize);
  const currentCZ = Math.floor((playerZ + chunkSize / 2) / chunkSize);

  for (let x = -2; x <= 2; x++) {
    for (let z = -2; z <= 2; z++) {
      const key = `${currentCX + x},${currentCZ + z}`;
      if (!chunks.has(key)) {
        chunks.set(key, createChunk(currentCX + x, currentCZ + z));
      }
    }
  }
}

// HAND & AXE ONLY
const handGroup = new THREE.Group();
const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.6 });
const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.45, 10), skinMat);
armMesh.rotation.x = Math.PI / 3;
armMesh.position.set(0, -0.1, 0.1);
handGroup.add(armMesh);

const axeGroup = new THREE.Group();
const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.35), new THREE.MeshStandardMaterial({color: 0x5c4033}));
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.02), new THREE.MeshStandardMaterial({color: 0x888888, metalness: 0.8}));
blade.position.set(0.05, 0.12, 0);
axeGroup.add(handle, blade);
axeGroup.position.set(0.05, 0.05, -0.2);
handGroup.add(axeGroup);

handGroup.position.set(0.25, -0.22, -0.35);
camera.add(handGroup);
scene.add(camera);

// HIGH QUALITY CAR
const carGroup = new THREE.Group();
const carPaintMat = new THREE.MeshStandardMaterial({ color: 0x8b0000, metalness: 0.7, roughness: 0.2 });
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95, roughness: 0.1 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.1, transmission: 0.9 });

const carBase = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.75, 4.8), carPaintMat);
carBase.position.y = 0.75;
carBase.castShadow = true;
carGroup.add(carBase);

const grille = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.4, 0.1), chromeMat);
grille.position.set(0, 0.7, 2.42);
const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.15, 0.2), chromeMat);
frontBumper.position.set(0, 0.45, 2.45);
carGroup.add(grille, frontBumper);

const cabinWindshield = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.85, 2.2), glassMat);
cabinWindshield.position.set(0, 1.45, -0.2);
carGroup.add(cabinWindshield);

const dashBoard = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.45, 0.6), new THREE.MeshStandardMaterial({ color: 0x111111 }));
dashBoard.position.set(0, 1.1, 0.6);
carGroup.add(dashBoard);

const steeringGroup = new THREE.Group();
const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.025, 8, 24), chromeMat);
const centerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05), new THREE.MeshStandardMaterial({ color: 0x111111 }));
centerMesh.rotation.x = Math.PI / 2;
steeringGroup.add(ringMesh, centerMesh);
steeringGroup.position.set(-0.55, 1.22, 0.35);
steeringGroup.rotation.x = -0.35;
carGroup.add(steeringGroup);

const seatMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
const driverSeat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.7), seatMat);
driverSeat.position.set(-0.55, 0.85, -0.2);
const passSeat = driverSeat.clone(); passSeat.position.x = 0.55;
carGroup.add(driverSeat, passSeat);

let engineLevel = 1;
const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 20);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
[[-1.2,0.42,1.5], [1.2,0.42,1.5], [-1.2,0.42,-1.5], [1.2,0.42,-1.5]].forEach(p => {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI / 2;
  w.position.set(...p);
  w.castShadow = true;
  carGroup.add(w);
});

carGroup.position.set(0, 0, 10);
scene.add(carGroup);

// CONTROLS STATE
const player = { x: 0, z: 0, y: 0, velY: 0, yaw: 0, pitch: 0, onGround: true, inCar: false };
const carState = { speed: 0, steerAngle: 0 };
const moveState = { fwd: false, bwd: false, lft: false, rgt: false };

const bindBtn = (id, key) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); moveState[key] = true; });
  el.addEventListener('pointerup', (e) => { e.preventDefault(); moveState[key] = false; });
};
bindBtn('btnUp', 'fwd'); bindBtn('btnDown', 'bwd'); bindBtn('btnLeft', 'lft'); bindBtn('btnRight', 'rgt');

document.getElementById('btnJump').addEventListener('pointerdown', () => {
  if (player.onGround && !player.inCar) { player.velY = 6.5; player.onGround = false; }
});

const carPedalBind = (id, action) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', () => carState[action] = true);
  el.addEventListener('pointerup', () => carState[action] = false);
};
carPedalBind('gasBtn', 'gas'); carPedalBind('brakeBtn', 'brake');
carPedalBind('steerLeft', 'left'); carPedalBind('steerRight', 'right');

// ENTER / EXIT CAR
const enterCarBtn = document.getElementById('enterCarBtn');
enterCarBtn.addEventListener('click', () => {
  player.inCar = !player.inCar;
  if(player.inCar){
    enterCarBtn.textContent = '🚪 پیاده شدن';
    document.getElementById('dpad').style.display = 'none';
    document.getElementById('carPedals').style.display = 'flex';
    document.getElementById('carSteering').style.display = 'flex';
    document.getElementById('speedometerUI').style.display = 'block';
    handGroup.visible = false;
  } else {
    enterCarBtn.textContent = '🚗 نشستن در ماشین';
    document.getElementById('dpad').style.display = 'grid';
    document.getElementById('carPedals').style.display = 'none';
    document.getElementById('carSteering').style.display = 'none';
    document.getElementById('speedometerUI').style.display = 'none';
    handGroup.visible = true;
    player.x = carGroup.position.x - 2.5;
    player.z = carGroup.position.z;
  }
});

// TOUCH LOOK
const lookArea = document.getElementById('lookArea');
let looking = false, lx = 0, ly = 0;
lookArea.addEventListener('pointerdown', e => { looking = true; lx = e.clientX; ly = e.clientY; });
lookArea.addEventListener('pointerup', () => looking = false);
lookArea.addEventListener('pointermove', e => {
  if (!looking) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  player.yaw -= dx * 0.005;
  player.pitch -= dy * 0.005;
  player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch));
});

// MAIN GAME LOOP
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (!player.inCar) {
    const speed = 5;
    let moveZ = (moveState.fwd ? 1 : 0) - (moveState.bwd ? 1 : 0);
    let moveX = (moveState.rgt ? 1 : 0) - (moveState.lft ? 1 : 0);

    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
    const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);

    player.x += (forward.x * moveZ + right.x * moveX) * speed * dt;
    player.z += (forward.z * moveZ + right.z * moveX) * speed * dt;

    player.velY -= 18 * dt;
    player.y += player.velY * dt;
    if (player.y <= 0) { player.y = 0; player.velY = 0; player.onGround = true; }

    camera.position.set(player.x, player.y + 1.5, player.z);
    enterCarBtn.style.display = (camera.position.distanceTo(carGroup.position) < 4.5) ? 'block' : 'none';

    updateChunks(player.x, player.z);
  } else {
    // Car Driving & Physics
    const maxSpeedByLevel = 70 + (engineLevel * 45);

    if (carState.gas) carState.speed = Math.min(carState.speed + 22 * dt, maxSpeedByLevel / 3.6);
    else if (carState.brake) carState.speed = Math.max(carState.speed - 22 * dt, -12);
    else carState.speed *= 0.97;

    if (carState.left) carState.steerAngle = Math.min(carState.steerAngle + 3 * dt, 0.8);
    else if (carState.right) carState.steerAngle = Math.max(carState.steerAngle - 3 * dt, -0.8);
    else carState.steerAngle *= 0.8;

    carGroup.rotation.y += carState.steerAngle * (carState.speed / 15) * dt;
    steeringGroup.rotation.z = -carState.steerAngle * 2.2;

    const carFwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
    carGroup.position.addScaledVector(carFwd, carState.speed * dt);

    // AUTO CAMERA ROTATION WITH CAR DIRECTION
    // زاویه دوربین همزمان و نرم به زاویه ماشین متصل می‌شود
    player.yaw = carGroup.rotation.y;

    // Driver Seat Position Calculation
    const driverSeatPos = new THREE.Vector3(-0.55, 1.4, -0.1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
    camera.position.copy(carGroup.position).add(driverSeatPos);

    document.getElementById('speedVal').textContent = Math.round(Math.abs(carState.speed * 3.6));
    document.getElementById('engineLvlVal').textContent = `LVL ${engineLevel}`;

    updateChunks(carGroup.position.x, carGroup.position.z);
  }

  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
